
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tutores - PetCare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

       body {
            background: #f4f8f7;
            color: #263b3b;
        }

        header {
            background: #ffffff;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

         .logo {
            color: #159b83;
            font-size: 27px;
            font-weight: bold;
        }

        .logo span {
            color: #344b4a;
        }

        h1 {
            color: #344b4a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        /* Caixa principal */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
        }

        /* Título da página */
        .container h1 {
            font-size: 30px;
            color: #344b4a;
            margin-bottom: 10px;
        }

        /* Descrição */
        .container p {
            color: #647574;
            margin-bottom: 25px;
        }

        /* Botões */
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        /* Botão excluir */
        .btn-excluir {
            background: #d94b4b;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
        }

       /* Botão Novo Tutor */
        .btn-novo {
            display: inline-block;
            background: #159b83;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-novo:hover {
            background: #117c6a;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(21,155,131,0.25);
        }

        /* Botão Voltar ao início */
        .btn-voltar {
            display: inline-block;
            background: #344b4a;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: #243735;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
}

        /* Tabela */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 15px;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        th {
            background: #159b83;
            color: white;
            font-weight: bold;
        }

        th:first-child {
            border-radius: 10px 0 0 10px;
        }

        th:last-child {
            border-radius: 0 10px 10px 0;
        }

        td {
            border-bottom: 1px solid #eeeeee;
            color: #344b4a;
        }

        /* Efeito nas linhas */
        tbody tr:hover {
            background: #f0faf7;
        }

         .menu a {
            text-decoration: none;
            color: #526563;
            margin-left: 22px;
            font-weight: 600;
            font-size: 14px;
        }

        .menu a:hover {
            color: #159b83;
        }   
        
        .botao {
            background: #2686a8;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .excluir {
            background: #c94b4b;
        }
          
           
    </style>
</head>

<body>
    <header>
        <div class="logo">🐾 Pet<span>Care</span></div>

        <nav class="menu">
            <a th:href="@{/}">Início</a>
            <a th:href="@{/tutores}">Tutores</a>
            <a th:href="@{/animais}">Animais</a>
            <a th:href="@{/consultas}">Consultas</a>
        </nav>
    </header>

<div class="container">

    <h1>🐾 Tutores cadastrados</h1>

    <br>    

    <p>Gerenciamento dos responsáveis pelos animais.</p>

    <br>

    <a href="/tutores/novo" class="btn-novo">
         + Novo Tutor
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="tutor : ${tutores}">

                <td th:text="${tutor.id}"></td>

                <td th:text="${tutor.nome}"></td>

                <td th:text="${tutor.cpf}"></td>

                <td th:text="${tutor.telefone}"></td>

                <td th:text="${tutor.email}"></td>

                <td>
                    <form th:action="@{/tutores/excluir/{id}(id=${tutor.id})}"
                          method="post"
                          onsubmit="return confirm('Deseja realmente excluir este tutor?')">

                        <button type="submit" class="btn-excluir">
                            Excluir
                        </button>

                    </form>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(tutores)}">
                <td colspan="6">Nenhum tutor cadastrado.</td>
            </tr>
        </tbody>
    </table>

    <br>

    <a href="/" class="btn-voltar">
        ← Voltar ao início
    </a>

</div>

</body>
</html>
